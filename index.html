<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Astro Guidage - Flèches</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: black; font-family: sans-serif;
        }
        #videoFlux {
            position: fixed; top: 50%; left: 50%; min-width: 100%; min-height: 100%;
            width: auto; height: auto; z-index: 1; transform: translate(-50%, -50%); object-fit: cover;
        }
        #interface {
            position: relative; z-index: 2; pointer-events: none;
            color: #00ff00; text-shadow: 1px 1px 2px black; padding: 15px; font-size: 14px;
        }
        button {
            pointer-events: auto; padding: 12px 24px; background-color: #222;
            color: #00ff00; border: 2px solid #00ff00; border-radius: 5px; font-size: 16px; margin: 5px;
        }
        #btnEtalonner {
            background-color: #800000; color: #ffcccc; border-color: #ff0000;
        }
        #mireCentrale {
            position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
            border: 2px solid #ff0000; border-radius: 50%; z-index: 3; transform: translate(-50%, -50%);
        }
        .fleche {
            position: absolute; z-index: 4; font-size: 40px; color: rgba(255, 255, 255, 0.2);
            transition: color 0.1s, transform 0.1s; text-shadow: 0 0 10px black;
        }
        .active { color: #ffff00; transform: scale(1.2); }
        #flecheHaut  { top: 35%; left: 50%; transform: translateX(-50%); }
        #flecheBas   { bottom: 35%; left: 50%; transform: translateX(-50%); }
        #flecheGauche{ top: 50%; left: 35%; transform: translateY(-50%); }
        #flecheDroite{ top: 50%; right: 35%; transform: translateY(-50%); }
    </style>
</head>
<body>

    <video id="videoFlux" autoplay playsinline muted></video>

    <div id="interface">
        <h2>Guidage Astro Clara</h2>
        <button id="btnDemarrer">1. Activer l'application</button>
        <button id="btnEtalonner" style="display:none;">2. Centrer sur Véga & Étalonner</button>
        <div id="telemetrie">En attente de l'activation...</div>
    </div>

    <div id="mireCentrale"></div>

    <div id="flecheHaut" class="fleche">▲</div>
    <div id="flecheBas" class="fleche">▼</div>
    <div id="flecheGauche" class="fleche">◀</div>
    <div id="flecheDroite" class="fleche">▶</div>

    <script>
        // Coordonnées cibles (Véga)
        const ETOILE_RA = 279.23;  
        const ETOILE_DEC = 38.78;  

        let gpsLat = 0, gpsLon = 0, gpsOk = false;
        let iphoneAzimut = 0, iphoneHauteur = 0, capteursOk = false;
        
        // Variables d'ajustement pour l'étalonnage manuel
        let offsetAzimut = 0;
        let offsetHauteur = 0;

        const btnDemarrer = document.getElementById('btnDemarrer');
        const btnEtalonner = document.getElementById('btnEtalonner');
        const telemetrie = document.getElementById('telemetrie');
        const fHaut = document.getElementById('flecheHaut');
        const fBas = document.getElementById('flecheBas');
        const fGauche = document.getElementById('flecheGauche');
        const fDroite = document.getElementById('flecheDroite');

        btnDemarrer.addEventListener('click', function() {
            btnDemarrer.style.display = 'none';
            btnEtalonner.style.display = 'inline-block';
            telemetrie.innerHTML = "Démarrage des modules...";

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(perm => {
                        if (perm === 'granted') {
                            window.addEventListener('deviceorientation', ecouterOrientation, true);
                            capteursOk = true;
                            demarrerCamera();
                            demarrerGPS();
                            requestAnimationFrame(bouclePrincipale);
                        } else {
                            telemetrie.innerHTML = "Permission capteurs refusée.";
                        }
                    })
                    .catch(err => {
                        telemetrie.innerHTML = "Erreur : " + err;
                    });
            } else {
                window.addEventListener('deviceorientation', ecouterOrientation, true);
                capteursOk = true;
                demarrerCamera();
                demarrerGPS();
                requestAnimationFrame(bouclePrincipale);
            }
        });

        // BOUTON COMPENSATION : Si vous avez Véga dans votre objectif mais que l'iPhone dit le contraire
        btnEtalonner.addEventListener('click', function() {
            if (gpsOk && capteursOk) {
                const positionTheorique = calculerPositionEtoile(gpsLat, gpsLon, ETOILE_RA, ETOILE_DEC);
                
                // On calcule l'écart entre le ciel réel et les capteurs déréglés
                offsetAzimut = positionTheorique.azimut - iphoneAzimut;
                offsetHauteur = positionTheorique.hauteur - iphoneHauteur;
                
                telemetrie.innerHTML = "Étalonnage réussi !";
            }
        });

        async function demarrerCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: 1280, height: 720 },
                    audio: false
                });
                document.getElementById('videoFlux').srcObject = stream;
            } catch (e) {
                console.log("Caméra en mode simulation.");
            }
        }

        function demarrerGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((pos) => {
                    gpsLat = pos.coords.latitude;
                    gpsLon = pos.coords.longitude;
                    gpsOk = true;
                }, null, { enableHighAccuracy: true });
            }
        }

        function ecouterOrientation(e) {
            // Lecture du cap (Azimut)
            if (e.webkitCompassHeading !== undefined) {
                iphoneAzimut = e.webkitCompassHeading;
            } else {
                iphoneAzimut = (360 - e.alpha) % 360;
            }

            // REPERE CAMERA ARRIERE IPHONE : 
            // Quand on pointe la caméra arrière grand-angle vers le ciel, l'axe 'gamma' (inclinaison latérale)
            // se transforme géométriquement en indicateur de hauteur sous iOS.
            if (Math.abs(e.beta) > 45) {
                // Si l'iPhone est tenu verticalement ou incliné face au ciel
                iphoneHauteur = 90 - Math.abs(e.beta);
            } else {
                // Si l'iPhone est plus à plat
                iphoneHauteur = Math.abs(e.gamma);
            }
            
            capteursOk = true;
        }

        function calculerPositionEtoile(lat, lon, ra, dec) {
            const maintenant = new Date();
            const julianDate = (maintenant.getTime() / 86400000) + 2440587.5;
            const D = julianDate - 2451545.0;

            let tsg = (280.46061837 + 360.98564736629 * D) % 360;
            let tsl = (tsg + lon + 360) % 360;
            let H = (tsl - ra + 360) % 360;

            const rLat = (lat * Math.PI) / 180;
            const rDec = (dec * Math.PI) / 180;
            const rH = (H * Math.PI) / 180;

            const sinH = Math.sin(rDec) * Math.sin(rLat) + Math.cos(rDec) * Math.cos(rLat) * Math.cos(rH);
            const hauteur = Math.asin(sinH) * 180 / Math.PI;

            const cosAz = (Math.sin(rDec) - Math.sin(rLat) * sinH) / (Math.cos(rLat) * Math.cos(Math.asin(sinH)));
            let azimut = Math.acos(Math.max(-1, Math.min(1, cosAz))) * 180 / Math.PI;
            if (Math.sin(rH) > 0) azimut = 360 - azimut;

            return { hauteur, azimut };
        }

        function bouclePrincipale() {
            if (!gpsOk || !capteursOk) {
                telemetrie.innerHTML = `Signaux... <br> GPS : ${gpsOk ? 'OK' : 'Attente'} | Capteurs : ${capteursOk ? 'OK' : 'Attente'}`;
                requestAnimationFrame(bouclePrincipale);
                return;
            }

            const etoile = calculerPositionEtoile(gpsLat, gpsLon, ETOILE_RA, ETOILE_DEC);

            // Application des filtres d'étalonnage
            let azimutAjuste = (iphoneAzimut + offsetAzimut + 360) % 360;
            let hauteurAjustee = iphoneHauteur + offsetHauteur;

            let deltaHauteur = etoile.hauteur - hauteurAjustee;
            let deltaAzimut = etoile.azimut - azimutAjuste;

            if (deltaAzimut > 180) deltaAzimut -= 360;
            if (deltaAzimut < -180) deltaAzimut += 360;

            telemetrie.innerHTML = `
                <b>Étoile (Théorique) :</b> Az ${etoile.azimut.toFixed(1)}° | Ht ${etoile.hauteur.toFixed(1)}°<br>
                <b>iPhone (Ajusté) :</b> Az ${azimutAjuste.toFixed(1)}° | Ht ${hauteurAjustee.toFixed(1)}°
            `;

            const TOLERANCE = 0.3; 

            if (deltaHauteur > TOLERANCE) { fHaut.classList.add('active'); fBas.classList.remove('active'); }
            else if (deltaHauteur < -TOLERANCE) { fBas.classList.add('active'); fHaut.classList.remove('active'); }
            else { fHaut.classList.remove('active'); fBas.classList.remove('active'); }

            if (deltaAzimut > TOLERANCE) { fDroite.classList.add('active'); fGauche.classList.remove('active'); }
            else if (deltaAzimut < -TOLERANCE) { fGauche.classList.add('active'); fDroite.classList.remove('active'); }
            else { fGauche.classList.remove('active'); fDroite.classList.remove('active'); }

            requestAnimationFrame(bouclePrincipale);
        }
    </script>
