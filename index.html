<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Astro Guidage Pro</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; font-family: sans-serif; }
        #videoFlux { position: fixed; top: 50%; left: 50%; min-width: 100%; min-height: 100%; width: auto; height: auto; z-index: 1; transform: translate(-50%, -50%); object-fit: cover; }
        #interface { position: relative; z-index: 2; pointer-events: none; color: #00ff00; text-shadow: 1px 1px 2px black; padding: 15px; font-size: 14px; }
        button { pointer-events: auto; padding: 12px 24px; background-color: #222; color: #00ff00; border: 2px solid #00ff00; border-radius: 5px; font-size: 16px; margin: 5px; }
        #btnEtalonner { background-color: #800000; color: #ffcccc; border-color: #ff0000; }
        #mireCentrale { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; border: 2px solid #ff0000; border-radius: 50%; z-index: 3; transform: translate(-50%, -50%); }
        .container-fleche { position: absolute; z-index: 4; width: 0; height: 0; border-style: solid; opacity: 0.15; transition: opacity 0.1s, transform 0.1s; }
        #flecheHaut { top: 30%; left: 50%; transform: translateX(-50%); border-width: 0 20px 30px 20px; border-color: transparent transparent #ffffff transparent; }
        #flecheBas { bottom: 30%; left: 50%; transform: translateX(-50%); border-width: 30px 20px 0 20px; border-color: #ffffff transparent transparent transparent; }
        #flecheGauche { top: 50%; left: 30%; transform: translateY(-50%); border-width: 20px 30px 20px 0; border-color: transparent #ffffff transparent transparent; }
        #flecheDroite { top: 50%; right: 30%; transform: translateY(-50%); border-width: 20px 0 20px 30px; border-color: transparent transparent transparent #ffffff; }
        #flecheHaut.active { border-bottom-color: #ffff00 !important; opacity: 1 !important; transform: translateX(-50%) scale(1.2); }
        #flecheBas.active { border-top-color: #ffff00 !important; opacity: 1 !important; transform: translateX(-50%) scale(1.2); }
        #flecheGauche.active { border-right-color: #ffff00 !important; opacity: 1 !important; transform: translateY(-50%) scale(1.2); }
        #flecheDroite.active { border-left-color: #ffff00 !important; opacity: 1 !important; transform: translateY(-50%) scale(1.2); }
    </style>
</head>
<body>

    <video id="videoFlux" autoplay playsinline muted></video>

    <div id="interface">
        <h2>Guidage Astro Clara</h2>
        <button id="btnDemarrer">1. Activer l'application</button>
        <button id="btnEtalonner" style="display:none;">2. Visiser le Pôle Nord & Étalonner</button>
        <div id="telemetrie">En attente de l'activation...</div>
    </div>

    <div id="mireCentrale"></div>

    <div id="flecheHaut" class="container-fleche"></div>
    <div id="flecheBas" class="container-fleche"></div>
    <div id="flecheGauche" class="container-fleche"></div>
    <div id="flecheDroite" class="container-fleche"></div>

    <script>
        // Coordonnées de la cible (Par défaut : Pôle Nord Céleste / Polaris)
        // Vous pouvez modifier ces valeurs à tout moment pour changer de cible astro
        const ETOILE_RA = 0.0; 
        const ETOILE_DEC = 90.0;  

        let gpsLat = 0, gpsLon = 0, gpsOk = false, iphoneAzimut = 0, iphoneHauteur = 0, capteursOk = false, offsetAzimut = 0, offsetHauteur = 0;

        const btnDemarrer = document.getElementById('btnDemarrer');
        const btnEtalonner = document.getElementById('btnEtalonner');
        const telemetrie = document.getElementById('telemetrie');
        const fHaut = document.getElementById('flecheHaut'), fBas = document.getElementById('flecheBas'), fGauche = document.getElementById('flecheGauche'), fDroite = document.getElementById('flecheDroite');

        btnDemarrer.addEventListener('click', function() {
            btnDemarrer.style.display = 'none';
            btnEtalonner.style.display = 'inline-block';
            telemetrie.innerHTML = "Démarrage des modules...";

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(perm => {
                    if (perm === 'granted') {
                        window.addEventListener('deviceorientation', ecouterOrientation, true);
                        capteursOk = true; demarrerCamera(); demarrerGPS(); requestAnimationFrame(bouclePrincipale);
                    } else { telemetrie.innerHTML = "Permission refusée."; }
                }).catch(err => { telemetrie.innerHTML = "Erreur : " + err; });
            } else {
                window.addEventListener('deviceorientation', ecouterOrientation, true);
                capteursOk = true; demarrerCamera(); demarrerGPS(); requestAnimationFrame(bouclePrincipale);
            }
        });

        btnEtalonner.addEventListener('click', function() {
            if (gpsOk && capteursOk) {
                const pos = calculerPositionEtoile(gpsLat, gpsLon, ETOILE_RA, ETOILE_DEC);
                offsetAzimut = pos.azimut - iphoneAzimut;
                offsetHauteur = pos.hauteur - iphoneHauteur;
                telemetrie.innerHTML = "Étalonnage mémorisé !";
            }
        });

        async function demarrerCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" }, width: 1280, height: 720 }, audio: false });
                document.getElementById('videoFlux').srcObject = stream;
            } catch (e) { console.log("Erreur vidéo."); }
        }

        function demarrerGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((pos) => { 
                    gpsLat = pos.coords.latitude; 
                    gpsLon = pos.coords.longitude; 
                    gpsOk = true; 
                }, null, { enableHighAccuracy: true });
            }
        }

        function ecouterOrientation(e) {
            iphoneAzimut = (e.webkitCompassHeading !== undefined) ? e.webkitCompassHeading : (360 - e.alpha) % 360;
            iphoneHauteur = e.beta - 90;
            capteursOk = true;
        }

        function calculerPositionEtoile(lat, lon, ra, dec) {
            const m = new Date();
            const UTC_heures = m.getUTCHours() + m.getUTCMinutes()/60 + m.getUTCSeconds()/3600;
            
            const annee = m.getUTCFullYear();
            const mois = m.getUTCMonth() + 1;
            const jour = m.getUTCDate();
            
            let A = Math.floor(annee / 100);
            let B = 2 - A + Math.floor(A / 4);
            let jd = Math.floor(365.25 * (annee + 4716)) + Math.floor(30.6001 * (mois + 1)) + jour + B - 1524.5 + (UTC_heures/24);
            const D = jd - 2451545.0;

            let tsg = (100.46061837 + 360.98564736629 * D) % 360;
            let tsl = (tsg + lon + 360) % 360;
            let H = (tsl - ra + 360) % 360;

            const rLat = (lat * Math.PI) / 180, rDec = (dec * Math.PI) / 180, rH = (H * Math.PI) / 180;
            const sinH = Math.sin(rDec) * Math.sin(rLat) + Math.cos(rDec) * Math.cos(rLat) * Math.cos(rH);
            const hauteur = Math.asin(sinH) * 180 / Math.PI;
            
            const cosAz = (Math.sin(rDec) - Math.sin(rLat) * sinH) / (Math.cos(rLat) * Math.cos(Math.asin(sinH)));
            let azimut = Math.acos(Math.max(-1, Math.min(1, cosAz))) * 180 / Math.PI;
            
            if (Math.sin(rH) > 0) { azimut = 360 - azimut; }
            
            return { azimut: azimut, hauteur: hauteur };
        }

        function bouclePrincipale() {
            if (gpsOk && capteursOk) {
                const cible = calculerPositionEtoile(gpsLat, gpsLon, ETOILE_RA, ETOILE_DEC);
                
                let azimutVirtuel = (iphoneAzimut + offsetAzimut + 360) % 360;
                let hauteurVirtuelle = iphoneHauteur + offsetHauteur;
                
                let diffAz = cible.azimut - azimutVirtuel;
                if (diffAz > 180) diffAz -= 360;
                if (diffAz < -180) diffAz += 360;
                let diffHaut = cible.hauteur - hauteurVirtuelle;

                telemetrie.innerHTML = `GPS: Ok | Capteurs: Ok<br>
                                       Cible -> Az: ${cible.azimut.toFixed(1)}° / Ht: ${cible.hauteur.toFixed(1)}°<br>
                                       Écart -> ΔAz: ${diffAz.toFixed(1)}° / ΔHt: ${diffHaut.toFixed(1)}°`;

                const SEUIL = 1.5;
                if (diffHaut > SEUIL) fHaut.classList.add('active'); else fHaut.classList.remove('active');
                if (diffHaut < -SEUIL) fBas.classList.add('active'); else fBas.classList.remove('active');
                if (diffAz > SEUIL) fDroite.classList.add('active'); else fDroite.classList.remove('active');
                if (diffAz < -SEUIL) fGauche.classList.add('active'); else fGauche.classList.remove('active');
            }
            requestAnimationFrame(bouclePrincipale);
        }
    </script>
</body>
</html>
